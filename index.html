<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1c1e">
<title>meds</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0; padding: 12px 12px max(12px, env(safe-area-inset-bottom)); max-width: 520px; margin-inline: auto; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  h1 { font-size: 1.1rem; margin: 0; }
  button { font: inherit; border-radius: 12px; border: 1px solid color-mix(in srgb, currentColor 25%, transparent); background: color-mix(in srgb, currentColor 8%, transparent); color: inherit; padding: 10px 14px; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  .small { padding: 6px 10px; font-size: .85rem; }
  .pills { display: grid; gap: 10px; margin: 14px 0; }
  .pill { text-align: left; padding: 16px; font-size: 1.15rem; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; min-height: 64px; }
  .pill .count { font-size: 1.8rem; font-weight: 600; }
  .pill .times { font-size: .8rem; opacity: .7; display: block; margin-top: 4px; }
  .pill .times b { font-weight: 600; }
  .pill:active { transform: scale(.98); }
  .edit { display: flex; gap: 8px; align-items: center; }
  input { font: inherit; padding: 8px; border-radius: 8px; border: 1px solid color-mix(in srgb, currentColor 30%, transparent); background: transparent; color: inherit; }
  input:disabled { opacity: .4; }
  input[type=text] { flex: 1; min-width: 0; }
  h2 { font-size: .85rem; opacity: .6; margin: 18px 0 6px; text-transform: uppercase; letter-spacing: .05em; }
  .dose { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid color-mix(in srgb, currentColor 12%, transparent); }
  .dose .name { flex: 1; }
  .dose .qty { width: 3.2em; text-align: center; }
  .dose .x { opacity: .6; margin-left: -6px; }
  .dose .pending { opacity: .6; font-size: .8rem; }
  h2.day { display: flex; justify-content: space-between; align-items: center; }
  h2.day button { text-transform: none; letter-spacing: 0; }
  .timeline { cursor: pointer; padding-bottom: 6px; border-bottom: 1px solid color-mix(in srgb, currentColor 12%, transparent); }
  .timeline:active { opacity: .7; }
  .timeline .axis { position: relative; height: 1em; margin: 0 8px; font-size: .65rem; opacity: .5; }
  .timeline .axis span { position: absolute; transform: translateX(-50%); }
  .timeline .head { display: flex; gap: 8px; align-items: baseline; margin-top: 6px; font-size: .9rem; }
  .timeline .name { white-space: nowrap; }
  .timeline .times { flex: 1; font-size: .75rem; opacity: .6; text-align: right; }
  .timeline .total { font-size: 1.1rem; min-width: 1.2em; text-align: right; }
  .timeline .track { --grid: color-mix(in srgb, currentColor 15%, transparent); position: relative; height: 18px; margin: 3px 8px 4px; border-bottom: 1px solid color-mix(in srgb, currentColor 20%, transparent);
    background: linear-gradient(to right, transparent calc(25% - .5px), var(--grid) 25%, transparent calc(25% + .5px), transparent calc(50% - .5px), var(--grid) 50%, transparent calc(50% + .5px), transparent calc(75% - .5px), var(--grid) 75%, transparent calc(75% + .5px)); }
  .timeline .dot { position: absolute; top: 2px; transform: translateX(-50%); min-width: 14px; height: 14px; border-radius: 7px; background: #4c8dff; color: #fff; font-size: .6rem; line-height: 14px; text-align: center; font-weight: 700; }
  .history-filter { margin: 22px 0 8px; padding-top: 14px; border-top: 1px solid color-mix(in srgb, currentColor 16%, transparent); }
  .filter-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 9px; }
  .filter-heading h2 { margin: 0; font-size: .7rem; opacity: .65; }
  .filter-clear { border: 0; background: transparent; padding: 4px 0 4px 8px; border-radius: 3px; font-size: .75rem; color: light-dark(#205dc5, #92b7ff); }
  .filter-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .filter-chip { padding: 5px 10px; min-height: 30px; border-radius: 20px; font-size: .78rem; background: transparent; line-height: 1.3; }
  .filter-chip[aria-pressed=true] { background: light-dark(#e7efff, #243a60); color: light-dark(#174b9f, #c4d9ff); border-color: #4c8dff; }
  .filter-chip[aria-pressed=true]::before { content: '✓ '; }
  .filter-more { padding: 5px 10px; min-height: 30px; border-radius: 20px; border-style: dashed; background: transparent; font-size: .75rem; color: light-dark(#205dc5, #92b7ff); }
  .filter-older { margin-top: 6px; }
  .filter-older[hidden] { display: none; }
  .filter-empty { margin: 20px 0; padding: 16px; text-align: center; font-size: .85rem; border: 1px dashed color-mix(in srgb, currentColor 22%, transparent); border-radius: 10px; opacity: .7; }
  .history-filter button:focus-visible { outline: 2px solid #4c8dff; outline-offset: 3px; }
  .history-gap { --gap-ink: light-dark(#ba5800, #ffb36b); display: grid; gap: 7px; margin: 18px 0 8px; padding: 4px 0; }
  .history-gap:focus-visible { outline: 2px solid var(--gap-ink); outline-offset: 5px; }
  .gap-mark { display: block; height: 2px; background: var(--gap-ink); border-radius: 2px; }
  .gap-mark[data-unit="week"] { --gap-ink: light-dark(#7850b5, #c5a5ff); height: 5px; margin-block: 4px; }
  .gap-mark[data-unit="month"] { --gap-ink: light-dark(#087c70, #67d8bf); height: 8px; margin-block: 4px; }
  .status { font-size: .8rem; opacity: .7; }
  footer { margin: 24px 0; font-size: .85rem; display: flex; gap: 14px; justify-content: center; opacity: .8; }
  a { color: inherit; }
</style>
</head>
<body>
<header>
  <h1>meds</h1>
  <span class="status" id="status"></span>
  <button class="small" id="toggleEdit">edit</button>
</header>
<div class="pills" id="pills"></div>
<div id="today"></div>
<section id="historyFilter" class="history-filter" aria-label="Past days medication filter"></section>
<div id="history"></div>
<footer><a href="/export.csv">export csv</a><a href="#" id="showAll">show all</a></footer>

<script>
const $ = (id) => document.getElementById(id);
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { console.error(e); return d; } };
const save = (k, v) => localStorage.setItem(k, JSON.stringify(v));

let state = load('state', { pills: [], doses: [] });
let queue = load('queue', []);       // pending dose upserts (full dose) and deletes ({ id, deleted: true })
for (const d of state.doses) d.quantity ??= 1; // cache written by the pre-quantity version
let editing = false;
const MERGE_MS = 10 * 60e3; // repeat tap on the same pill within this window bumps quantity instead of adding a dose
let order = {}; // ponytail: pill order frozen per visit so a tap doesn't reshuffle the buttons under your finger
let showAll = false;
let openDays = new Set(); // past days switched from the timeline to the editable list
const selectedPills = new Set();
let showOlderPills = false;
let online = navigator.onLine;

const dayKey = (iso) => new Date(iso).toLocaleDateString('sv-SE');
const timeStr = (iso) => new Date(iso).toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' }); // 24h HH:MM, also valid <input type=time> value
const dayLabel = (key) => {
  const today = dayKey(new Date().toISOString());
  const yest = dayKey(new Date(Date.now() - 864e5).toISOString());
  if (key === today) return 'today';
  if (key === yest) return 'yesterday';
  return new Date(key).toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' });
};
const agoStr = (ms) => { // just now · 45m ago · 2h 15m ago · 1d 3h ago · 12d ago
  const m = Math.floor((Date.now() - ms) / 60e3), h = Math.floor(m / 60), d = Math.floor(h / 24);
  if (m < 1) return 'just now';
  if (h < 1) return `${m}m ago`;
  if (d < 1) return m % 60 ? `${h}h ${m % 60}m ago` : `${h}h ago`;
  if (d < 7 && h % 24) return `${d}d ${h % 24}h ago`;
  return `${d}d ago`;
};
const lastStr = (ms) => { // yesterday 12:45 · Monday 21:04
  const iso = new Date(ms).toISOString();
  const day = dayLabel(dayKey(iso)) === 'yesterday' ? 'yesterday' : new Date(ms).toLocaleDateString([], { weekday: 'long' });
  return `${day} ${timeStr(iso)}`;
};

async function api(method, url, body) {
  const r = await fetch(url, { method, headers: { 'content-type': 'application/json' }, body: body && JSON.stringify(body) });
  if (!r.ok) throw new Error(`${method} ${url} → ${r.status}`);
  return r;
}

async function refresh() {
  try {
    state = await (await api('GET', '/api/state')).json();
    save('state', state);
    setOnline(true);
  } catch (err) {
    console.error(err);
    setOnline(false);
  }
  render();
}

function setOnline(v) { online = v; $('status').textContent = v ? '' : 'offline'; }

async function flush() {
  while (queue.length) {
    const q = queue[0], sent = JSON.stringify(q);
    try { await (q.deleted ? api('DELETE', `/api/doses/${q.id}`) : api('POST', '/api/doses', q)); }
    catch (err) { console.error(err); setOnline(false); render(); return; }
    // ponytail: queue[0] may have been edited (or shifted by a parallel flush) while in flight; only drop it if it's what we sent
    if (JSON.stringify(queue[0]) === sent) { queue.shift(); save('queue', queue); }
  }
  await refresh();
}

// ponytail: an offline tap = local insert/bump + queued upsert with a client uuid; the queue always carries the full dose
function logDose(pill_id) {
  const now = Date.now();
  let dose = state.doses.find((d) => d.pill_id === pill_id && Math.abs(now - Date.parse(d.taken_at)) < MERGE_MS);
  if (dose) dose.quantity += 1;
  else { dose = { id: crypto.randomUUID(), pill_id, taken_at: new Date(now).toISOString(), quantity: 1 }; state.doses.unshift(dose); }
  save('state', state);
  const q = queue.find((q) => q.id === dose.id);
  if (q) q.quantity = dose.quantity; else queue.push({ ...dose });
  save('queue', queue);
  render();
  flush();
}
const isPending = (id) => queue.some((q) => q.id === id);
// ponytail: a not-yet-synced dose is edited locally and in its queue entry (works offline); change = null deletes it
function editPending(d, change) {
  const i = queue.findIndex((q) => q.id === d.id);
  if (change === null) { state.doses = state.doses.filter((x) => x !== d); queue[i] = { id: d.id, deleted: true }; }
  else { Object.assign(d, change); queue[i] = { ...d }; state.doses.sort((a, b) => b.taken_at.localeCompare(a.taken_at)); }
  save('state', state); save('queue', queue);
  render();
  flush();
}

function render() {
  const pillById = Object.fromEntries(state.pills.map((p) => [p.id, p]));
  const today = dayKey(new Date().toISOString());
  const lastUse = {};
  for (const d of state.doses) lastUse[d.pill_id] = Math.max(lastUse[d.pill_id] ?? 0, Date.parse(d.taken_at));
  for (const p of state.pills) order[p.id] ??= lastUse[p.id] ?? 0;
  const pills = state.pills.filter((p) => editing || !p.hidden).sort((a, b) => order[b.id] - order[a.id]);

  const pillsEl = $('pills'); pillsEl.replaceChildren();
  for (const p of pills) {
    if (editing) {
      const row = el('div', 'edit');
      const name = el('input'); name.type = 'text'; name.value = p.name;
      name.onchange = () => api('PATCH', `/api/pills/${p.id}`, { name: name.value }).then(refresh).catch(fail);
      const hide = el('button', 'small', p.hidden ? 'unhide' : 'hide');
      hide.onclick = () => api('PATCH', `/api/pills/${p.id}`, { hidden: !p.hidden }).then(refresh).catch(fail);
      row.append(name, hide); pillsEl.append(row);
      continue;
    }
    const todays = state.doses.filter((d) => d.pill_id === p.id && dayKey(d.taken_at) === today).sort((a, b) => a.taken_at.localeCompare(b.taken_at));
    const b = el('button', 'pill');
    const left = el('span'); left.textContent = p.name;
    const last = lastUse[p.id];
    const times = el('span', 'times');
    if (last) times.append(el('b', '', agoStr(last)), ' · ');
    times.append(todays.map((d) => timeStr(d.taken_at) + (d.quantity > 1 ? ` ×${d.quantity}` : '')).join(' · ') || (last ? `none today, last ${lastStr(last)}` : 'none today'));
    left.append(times);
    b.append(left, el('span', 'count', String(todays.reduce((n, d) => n + d.quantity, 0))));
    b.onclick = () => logDose(p.id);
    pillsEl.append(b);
  }
  if (editing) {
    const row = el('div', 'edit');
    const name = el('input'); name.type = 'text'; name.placeholder = 'new pill name';
    const add = el('button', 'small', 'add');
    add.onclick = () => name.value.trim() && api('POST', '/api/pills', { name: name.value }).then(refresh).catch(fail);
    row.append(name, add); pillsEl.append(row);
  }
  $('toggleEdit').textContent = editing ? 'done' : 'edit';
  $('toggleEdit').disabled = !online;

  const hist = $('history'); hist.replaceChildren();
  const todayHist = $('today'); todayHist.replaceChildren();
  const cutoff = new Date(Date.now() - 7 * 864e5).toISOString();
  const byDay = new Map();
  for (const d of state.doses) {
    if (!showAll && d.taken_at < cutoff) continue;
    const k = dayKey(d.taken_at);
    if (k !== today && selectedPills.size && !selectedPills.has(d.pill_id)) continue;
    if (!byDay.has(k)) byDay.set(k, []);
    byDay.get(k).push(d);
  }
  for (const [k, dayDoses] of byDay) {
    const container = k === today ? todayHist : hist;
    const h = el('h2', 'day', dayLabel(k)); h.dataset.day = k; container.append(h);
    // ponytail: past days show a read-only timeline; tap it to get the editable list (today and edit mode always get the list)
    if (k === today || editing || openDays.has(k)) {
      if (k !== today && !editing) {
        const done = el('button', 'small', 'done');
        done.onclick = () => { openDays.delete(k); render(); };
        h.append(done);
      }
      for (const d of dayDoses) container.append(doseRow(d, k, today, pillById));
      continue;
    }
    const tl = timeline(dayDoses, pillById);
    tl.onclick = () => { openDays.add(k); render(); };
    container.append(tl);
  }
  if (!hist.hasChildNodes()) hist.append(el('p', 'filter-empty', selectedPills.size ? 'No matching doses in this date range.' : 'No past doses in this date range.'));
  renderHistoryGaps(byDay, today, cutoff);
  $('showAll').textContent = showAll ? 'show last 7 days' : 'show all';
  renderHistoryFilter(lastUse, Date.parse(cutoff));
}

// ponytail: calendar ordinals count local date labels, not elapsed hours across DST.
function dayOrdinal(key) {
  const [year, month, day] = key.split('-').map(Number);
  return Date.UTC(year, month - 1, day) / 864e5;
}

function ordinalDay(ordinal) {
  return new Date(ordinal * 864e5).toISOString().slice(0, 10);
}

function gapPeriods(days) {
  const byMonth = new Map();
  for (const day of days) {
    const month = day.slice(0, 7);
    if (!byMonth.has(month)) byMonth.set(month, []);
    byMonth.get(month).push(day);
  }
  const fullMonths = new Map([...byMonth].filter(([key, dates]) => {
    const [year, month] = key.split('-').map(Number);
    return dates.length === new Date(Date.UTC(year, month, 0)).getUTCDate();
  }));
  const periods = [];
  for (let i = 0; i < days.length;) {
    const day = days[i];
    let unit = 'day', dates = [day];
    const month = fullMonths.get(day.slice(0, 7));
    if (month) { unit = 'month'; dates = month; }
    else {
      const ordinal = dayOrdinal(day);
      const week = days.slice(i, i + 7);
      // ponytail: reserve complete months first; a cross-month week must not consume part of one.
      if (new Date(ordinal * 864e5).getUTCDay() === 0 && week.length === 7 && week.every((date, offset) => dayOrdinal(date) === ordinal - offset && !fullMonths.has(date.slice(0, 7)))) {
        unit = 'week'; dates = week;
      }
    }
    periods.push({ unit, start: dates.at(-1), end: dates[0], days: dates });
    i += dates.length;
  }
  return periods;
}

function historyGap(days) {
  const gap = el('div', 'history-gap');
  const scope = selectedPills.size ? 'selected medicines' : 'any medicine';
  const dates = days.length === 1 ? days[0] : `${days.at(-1)} through ${days[0]}`;
  gap.title = `${days.length} ${days.length === 1 ? 'day' : 'days'} with no doses logged for ${scope}: ${dates}`;
  gap.setAttribute('role', 'img');
  gap.setAttribute('aria-label', gap.title);
  gap.tabIndex = 0;
  for (const period of gapPeriods(days)) {
    const mark = el('span', 'gap-mark');
    mark.dataset.unit = period.unit;
    const label = period.unit === 'day' ? '1 day' : `Full ${period.unit}`;
    const range = period.start === period.end ? period.start : `${period.start} through ${period.end}`;
    mark.title = `${label} with no doses logged for ${scope}: ${range} (${period.days.length} ${period.days.length === 1 ? 'day' : 'days'})`;
    mark.setAttribute('aria-hidden', 'true');
    gap.append(mark);
  }
  return gap;
}

function renderHistoryGaps(byDay, today, cutoff) {
  const history = $('history');
  const pastDays = [...byDay.keys()].filter((key) => key < today).sort().reverse();
  const allPastDays = state.doses.map((dose) => dayKey(dose.taken_at)).filter((key) => key < today).sort();
  const start = showAll ? (allPastDays[0] ?? today) : dayKey(cutoff);
  // ponytail: a dose before the rolling cutoff still occupies its calendar day; never mark that day empty.
  const occupied = new Set(state.doses.filter((dose) => !selectedPills.size || selectedPills.has(dose.pill_id)).map((dose) => dayKey(dose.taken_at)));
  let previous = dayOrdinal(today);
  for (const key of pastDays) {
    const days = [];
    for (let day = previous - 1; day > dayOrdinal(key); day--) {
      const date = ordinalDay(day);
      if (date >= start && !occupied.has(date)) days.push(date);
    }
    if (days.length) history.insertBefore(historyGap(days), history.querySelector(`[data-day="${key}"]`));
    previous = dayOrdinal(key);
  }
  if (!pastDays.length) {
    const days = [];
    for (let day = previous - 1; day >= dayOrdinal(start); day--) {
      const date = ordinalDay(day);
      if (!occupied.has(date)) days.push(date);
    }
    if (days.length) history.prepend(historyGap(days));
  }
}

function renderHistoryFilter(lastUse, cutoff) {
  const wrap = $('historyFilter');
  const focusId = wrap.contains(document.activeElement) ? document.activeElement.id : null;
  wrap.replaceChildren();
  wrap.hidden = !state.pills.length;
  const heading = el('div', 'filter-heading');
  heading.append(el('h2', '', 'Past days'));
  if (selectedPills.size) {
    const clear = el('button', 'filter-clear', 'Clear'); clear.id = 'filter-clear';
    clear.onclick = () => { selectedPills.clear(); render(); };
    heading.append(clear);
  }
  const group = el('div');
  group.setAttribute('role', 'group');
  group.setAttribute('aria-label', 'Filter past days by medication');
  const recent = el('div', 'filter-chips');
  const older = el('div', 'filter-chips filter-older'); older.id = 'filter-older';
  let olderCount = 0, olderSelected = 0;
  // ponytail: include hidden medications so their old doses can still be filtered; More uses the same 7-day cutoff as history.
  const pills = [...state.pills].sort((a, b) => (lastUse[b.id] ?? 0) - (lastUse[a.id] ?? 0));
  for (const pill of pills) {
    const chip = el('button', 'filter-chip', pill.name); chip.id = `filter-pill-${pill.id}`;
    chip.setAttribute('aria-pressed', String(selectedPills.has(pill.id)));
    chip.onclick = () => {
      if (selectedPills.has(pill.id)) selectedPills.delete(pill.id); else selectedPills.add(pill.id);
      render();
    };
    if ((lastUse[pill.id] ?? 0) >= cutoff) recent.append(chip);
    else { older.append(chip); olderCount++; if (selectedPills.has(pill.id)) olderSelected++; }
  }
  if (olderCount) {
    const more = el('button', 'filter-more'); more.id = 'filter-more';
    more.setAttribute('aria-controls', older.id);
    const updateMore = () => {
      older.hidden = !showOlderPills;
      more.setAttribute('aria-expanded', String(showOlderPills));
      more.textContent = showOlderPills ? 'Less' : `More (${olderCount})${olderSelected ? ` · ${olderSelected} selected` : ''}`;
    };
    more.onclick = () => { showOlderPills = !showOlderPills; updateMore(); };
    updateMore();
    recent.append(more);
  }
  group.append(recent);
  if (olderCount) group.append(older);
  wrap.append(heading, group);
  if (focusId) {
    const focused = $(focusId);
    const target = focused && !focused.closest('[hidden]') ? focused : recent.querySelector('button');
    target?.focus({ preventScroll: true });
  }
}

function doseRow(d, k, today, pillById) {
  const row = el('div', 'dose');
  // ponytail: edit mode swaps the time input for a date input (max today); normal view keeps the one-tap time change
  const pending = isPending(d.id);
  const update = (change) => pending ? editPending(d, change) : api('PATCH', `/api/doses/${d.id}`, change).then(refresh).catch(fail);
  const t = el('input'); t.type = editing ? 'date' : 'time'; t.disabled = !online && !pending;
  if (editing) { t.value = k; t.max = today; } else t.value = timeStr(d.taken_at);
  t.onchange = () => {
    if (!t.value) return;
    const dt = new Date(d.taken_at);
    if (editing) { const [y, mo, day] = t.value.split('-').map(Number); dt.setFullYear(y, mo - 1, day); }
    else { const [h, m] = t.value.split(':').map(Number); dt.setHours(h, m); }
    update({ taken_at: dt.toISOString() });
  };
  const qty = el('input', 'qty'); qty.type = 'number'; qty.min = 1; qty.value = d.quantity; qty.disabled = t.disabled;
  qty.onchange = () => {
    const n = Number(qty.value);
    if (!Number.isInteger(n) || n < 1) return render(); // a queued bad value would 400 and block the queue forever
    update({ quantity: n });
  };
  const name = el('span', 'name', pillById[d.pill_id]?.name ?? '?');
  if (pending) name.append(' ', el('span', 'pending', '(not synced)'));
  const del = el('button', 'small', 'delete'); del.disabled = t.disabled;
  del.onclick = () => pending ? editPending(d, null) : api('DELETE', `/api/doses/${d.id}`).then(refresh).catch(fail);
  row.append(t, qty, el('span', 'x', '×'), name, del);
  return row;
}

// one row per pill (button order): name, times, day total, and a 24h track with a dot per dose (number = quantity > 1)
function timeline(dayDoses, pillById) {
  const byPill = new Map();
  for (const d of [...dayDoses].reverse()) {
    if (!byPill.has(d.pill_id)) byPill.set(d.pill_id, []);
    byPill.get(d.pill_id).push(d);
  }
  const wrap = el('div', 'timeline');
  const axis = el('div', 'axis');
  for (const h of [0, 6, 12, 18, 24]) { const s = el('span', '', String(h).padStart(2, '0')); s.style.left = `${h / 24 * 100}%`; axis.append(s); }
  wrap.append(axis);
  const pillIds = [...byPill.keys()].sort((a, b) => (order[b] ?? 0) - (order[a] ?? 0));
  for (const id of pillIds) {
    const ds = byPill.get(id);
    const head = el('div', 'head');
    head.append(
      el('span', 'name', pillById[id]?.name ?? '?'),
      el('span', 'times', ds.map((d) => timeStr(d.taken_at) + (d.quantity > 1 ? ` ×${d.quantity}` : '')).join(' · ')),
      el('b', 'total', String(ds.reduce((n, d) => n + d.quantity, 0))),
    );
    const track = el('div', 'track');
    for (const d of ds) {
      const t = new Date(d.taken_at);
      const dot = el('span', 'dot', d.quantity > 1 ? String(d.quantity) : '');
      dot.style.left = `${(t.getHours() * 60 + t.getMinutes()) / 1440 * 100}%`;
      track.append(dot);
    }
    wrap.append(head, track);
  }
  return wrap;
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function fail(err) { console.error(err); setOnline(false); render(); }

$('toggleEdit').onclick = () => { editing = !editing; render(); };
$('showAll').onclick = (e) => { e.preventDefault(); showAll = !showAll; render(); };
addEventListener('online', flush);
addEventListener('offline', () => { setOnline(false); render(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState !== 'visible') return; order = {}; flush(); });
// ponytail: re-render keeps the "ago" text current; skipped while an input has focus so a half-typed edit isn't wiped
setInterval(() => { if (document.visibilityState === 'visible' && !document.activeElement?.matches('input')) render(); }, 30e3);

render();
flush();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(console.error);
</script>
