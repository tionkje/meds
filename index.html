<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1c1e">
<title>meds</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0; padding: 12px 12px max(12px, env(safe-area-inset-bottom)); max-width: 520px; margin-inline: auto; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  h1 { font-size: 1.1rem; margin: 0; }
  button { font: inherit; border-radius: 12px; border: 1px solid color-mix(in srgb, currentColor 25%, transparent); background: color-mix(in srgb, currentColor 8%, transparent); color: inherit; padding: 10px 14px; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  .small { padding: 6px 10px; font-size: .85rem; }
  .pills { display: grid; gap: 10px; margin: 14px 0; }
  .pill { text-align: left; padding: 16px; font-size: 1.15rem; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; min-height: 64px; }
  .pill .count { font-size: 1.8rem; font-weight: 600; }
  .pill .times { font-size: .8rem; opacity: .7; display: block; margin-top: 4px; }
  .pill .times b { font-weight: 600; }
  .pill:active { transform: scale(.98); }
  .edit { display: flex; gap: 8px; align-items: center; }
  input { font: inherit; padding: 8px; border-radius: 8px; border: 1px solid color-mix(in srgb, currentColor 30%, transparent); background: transparent; color: inherit; }
  input[type=text] { flex: 1; min-width: 0; }
  h2 { font-size: .85rem; opacity: .6; margin: 18px 0 6px; text-transform: uppercase; letter-spacing: .05em; }
  .dose { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid color-mix(in srgb, currentColor 12%, transparent); }
  .dose .name { flex: 1; }
  .dose .qty { width: 3.2em; text-align: center; }
  .dose .x { opacity: .6; margin-left: -6px; }
  .dose .pending { opacity: .6; font-size: .8rem; }
  .status { font-size: .8rem; opacity: .7; }
  footer { margin: 24px 0; font-size: .85rem; display: flex; gap: 14px; justify-content: center; opacity: .8; }
  a { color: inherit; }
</style>
</head>
<body>
<header>
  <h1>meds</h1>
  <span class="status" id="status"></span>
  <button class="small" id="toggleEdit">edit</button>
</header>
<div class="pills" id="pills"></div>
<div id="history"></div>
<footer><a href="/export.csv">export csv</a><a href="#" id="showAll">show all</a></footer>

<script>
const $ = (id) => document.getElementById(id);
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { console.error(e); return d; } };
const save = (k, v) => localStorage.setItem(k, JSON.stringify(v));

let state = load('state', { pills: [], doses: [] });
let queue = load('queue', []);       // pending dose upserts
for (const d of state.doses) d.quantity ??= 1; // cache written by the pre-quantity version
let editing = false;
const MERGE_MS = 10 * 60e3; // repeat tap on the same pill within this window bumps quantity instead of adding a dose
let order = {}; // ponytail: pill order frozen per visit so a tap doesn't reshuffle the buttons under your finger
let showAll = false;
let online = navigator.onLine;

const dayKey = (iso) => new Date(iso).toLocaleDateString('sv-SE');
const timeStr = (iso) => new Date(iso).toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' }); // 24h HH:MM, also valid <input type=time> value
const dayLabel = (key) => {
  const today = dayKey(new Date().toISOString());
  const yest = dayKey(new Date(Date.now() - 864e5).toISOString());
  if (key === today) return 'today';
  if (key === yest) return 'yesterday';
  return new Date(key).toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' });
};
const agoStr = (ms) => { // just now · 45m ago · 2h 15m ago · 1d 3h ago · 12d ago
  const m = Math.floor((Date.now() - ms) / 60e3), h = Math.floor(m / 60), d = Math.floor(h / 24);
  if (m < 1) return 'just now';
  if (h < 1) return `${m}m ago`;
  if (d < 1) return m % 60 ? `${h}h ${m % 60}m ago` : `${h}h ago`;
  if (d < 7 && h % 24) return `${d}d ${h % 24}h ago`;
  return `${d}d ago`;
};
const lastStr = (ms) => { // yesterday 12:45 · Monday 21:04
  const iso = new Date(ms).toISOString();
  const day = dayLabel(dayKey(iso)) === 'yesterday' ? 'yesterday' : new Date(ms).toLocaleDateString([], { weekday: 'long' });
  return `${day} ${timeStr(iso)}`;
};

async function api(method, url, body) {
  const r = await fetch(url, { method, headers: { 'content-type': 'application/json' }, body: body && JSON.stringify(body) });
  if (!r.ok) throw new Error(`${method} ${url} → ${r.status}`);
  return r;
}

async function refresh() {
  try {
    state = await (await api('GET', '/api/state')).json();
    save('state', state);
    setOnline(true);
  } catch (err) {
    console.error(err);
    setOnline(false);
  }
  render();
}

function setOnline(v) { online = v; $('status').textContent = v ? '' : 'offline'; }

async function flush() {
  while (queue.length) {
    try { await api('POST', '/api/doses', queue[0]); }
    catch (err) { console.error(err); setOnline(false); render(); return; }
    queue.shift(); save('queue', queue);
  }
  await refresh();
}

// ponytail: an offline tap = local insert/bump + queued upsert with a client uuid; the queue always carries the full dose
function logDose(pill_id) {
  const now = Date.now();
  let dose = state.doses.find((d) => d.pill_id === pill_id && Math.abs(now - Date.parse(d.taken_at)) < MERGE_MS);
  if (dose) dose.quantity += 1;
  else { dose = { id: crypto.randomUUID(), pill_id, taken_at: new Date(now).toISOString(), quantity: 1 }; state.doses.unshift(dose); }
  save('state', state);
  const q = queue.find((q) => q.id === dose.id);
  if (q) q.quantity = dose.quantity; else queue.push({ ...dose });
  save('queue', queue);
  render();
  flush();
}
const isPending = (id) => queue.some((q) => q.id === id);

function render() {
  const pillById = Object.fromEntries(state.pills.map((p) => [p.id, p]));
  const today = dayKey(new Date().toISOString());
  const lastUse = {};
  for (const d of state.doses) lastUse[d.pill_id] = Math.max(lastUse[d.pill_id] ?? 0, Date.parse(d.taken_at));
  for (const p of state.pills) order[p.id] ??= lastUse[p.id] ?? 0;
  const pills = state.pills.filter((p) => editing || !p.hidden).sort((a, b) => order[b.id] - order[a.id]);

  const pillsEl = $('pills'); pillsEl.replaceChildren();
  for (const p of pills) {
    if (editing) {
      const row = el('div', 'edit');
      const name = el('input'); name.type = 'text'; name.value = p.name;
      name.onchange = () => api('PATCH', `/api/pills/${p.id}`, { name: name.value }).then(refresh).catch(fail);
      const hide = el('button', 'small', p.hidden ? 'unhide' : 'hide');
      hide.onclick = () => api('PATCH', `/api/pills/${p.id}`, { hidden: !p.hidden }).then(refresh).catch(fail);
      row.append(name, hide); pillsEl.append(row);
      continue;
    }
    const todays = state.doses.filter((d) => d.pill_id === p.id && dayKey(d.taken_at) === today).sort((a, b) => a.taken_at.localeCompare(b.taken_at));
    const b = el('button', 'pill');
    const left = el('span'); left.textContent = p.name;
    const last = lastUse[p.id];
    const times = el('span', 'times');
    if (last) times.append(el('b', '', agoStr(last)), ' · ');
    times.append(todays.map((d) => timeStr(d.taken_at) + (d.quantity > 1 ? ` ×${d.quantity}` : '')).join(' · ') || (last ? `none today, last ${lastStr(last)}` : 'none today'));
    left.append(times);
    b.append(left, el('span', 'count', String(todays.reduce((n, d) => n + d.quantity, 0))));
    b.onclick = () => logDose(p.id);
    pillsEl.append(b);
  }
  if (editing) {
    const row = el('div', 'edit');
    const name = el('input'); name.type = 'text'; name.placeholder = 'new pill name';
    const add = el('button', 'small', 'add');
    add.onclick = () => name.value.trim() && api('POST', '/api/pills', { name: name.value }).then(refresh).catch(fail);
    row.append(name, add); pillsEl.append(row);
  }
  $('toggleEdit').textContent = editing ? 'done' : 'edit';
  $('toggleEdit').disabled = !online;

  const hist = $('history'); hist.replaceChildren();
  const cutoff = new Date(Date.now() - 7 * 864e5).toISOString();
  const doses = state.doses.filter((d) => showAll || d.taken_at >= cutoff);
  let curDay = null;
  for (const d of doses) {
    const k = dayKey(d.taken_at);
    if (k !== curDay) { curDay = k; hist.append(el('h2', '', dayLabel(k))); }
    const row = el('div', 'dose');
    // ponytail: edit mode swaps the time input for a date input (max today); normal view keeps the one-tap time change
    const t = el('input'); t.type = editing ? 'date' : 'time'; t.disabled = !online || isPending(d.id);
    if (editing) { t.value = k; t.max = today; } else t.value = timeStr(d.taken_at);
    t.onchange = () => {
      if (!t.value) return;
      const dt = new Date(d.taken_at);
      if (editing) { const [y, mo, day] = t.value.split('-').map(Number); dt.setFullYear(y, mo - 1, day); }
      else { const [h, m] = t.value.split(':').map(Number); dt.setHours(h, m); }
      api('PATCH', `/api/doses/${d.id}`, { taken_at: dt.toISOString() }).then(refresh).catch(fail);
    };
    const qty = el('input', 'qty'); qty.type = 'number'; qty.min = 1; qty.value = d.quantity; qty.disabled = t.disabled;
    qty.onchange = () => api('PATCH', `/api/doses/${d.id}`, { quantity: Number(qty.value) }).then(refresh).catch(fail);
    const name = el('span', 'name', pillById[d.pill_id]?.name ?? '?');
    if (isPending(d.id)) name.append(' ', el('span', 'pending', '(not synced)'));
    const del = el('button', 'small', 'delete'); del.disabled = t.disabled;
    del.onclick = () => api('DELETE', `/api/doses/${d.id}`).then(refresh).catch(fail);
    row.append(t, qty, el('span', 'x', '×'), name, del); hist.append(row);
  }
  $('showAll').textContent = showAll ? 'show last 7 days' : 'show all';
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function fail(err) { console.error(err); setOnline(false); render(); }

$('toggleEdit').onclick = () => { editing = !editing; render(); };
$('showAll').onclick = (e) => { e.preventDefault(); showAll = !showAll; render(); };
addEventListener('online', flush);
addEventListener('offline', () => { setOnline(false); render(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState !== 'visible') return; order = {}; flush(); });
// ponytail: re-render keeps the "ago" text current; skipped while an input has focus so a half-typed edit isn't wiped
setInterval(() => { if (document.visibilityState === 'visible' && !document.activeElement?.matches('input')) render(); }, 30e3);

render();
flush();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(console.error);
</script>
</body>
</html>
